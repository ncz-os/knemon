[project]
name = "mnemos-core"
version = "6.2.5"
description = "Local stub for F04 testing — mnemos-core is not published to PyPI as an independently installable package (it ships bundled with mnemos-deploy); this stub exists only so uv's resolver can satisfy `mnemos-core>=6.2,<7` in this checkout. The runtime stubs that KNEMON's F04 regression tests need are injected via `tests/conftest.py` (search for `mnemos_core_runtime`); this stub itself ships no Python package, so setuptools' wheel build cannot synthesize an `mnemos/__init__.py` that would shadow the project's namespace."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
# Explicit empty: the stub ships no Python packages. Auto-discovery is
# disabled (we list nothing to include) so setuptools never emits an
# `mnemos/__init__.py` into the wheel, preserving the PEP 420
# namespace contribution to the project's existing `mnemos.api` /
# `mnemos.domain` packages.
include = []