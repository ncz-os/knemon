[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-knemon"
version = "0.1.0"
description = "KNEMON budget/cost plane — extracted from mnemos monorepo (namespace pkg on mnemos-core)"
requires-python = ">=3.11"
dependencies = ["mnemos-core", "fastapi"]

[tool.setuptools.packages.find]
include = ["mnemos*"]
namespaces = true
